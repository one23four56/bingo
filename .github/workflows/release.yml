name: Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      pages-artifact: pages
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build project
        run: npm run pack

      - name: Zip `static` folder
        run: |
          cd static
          zip ../static.zip *

      - name: Attach `static.zip` as artifact
        uses: actions/upload-artifact@v7
        with:
          path: static.zip
          archive: false

      - name: Upload `static.zip` to release
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v3
        with:
          files: |
            static.zip

      - uses: actions/upload-pages-artifact@v3
        with:
          path: static

  deploy-pages:
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
